name: Validate workshop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Parse YAML
        run: |
          for file in manifests/*.yaml .github/workflows/*.yml; do
            ruby -e 'require "yaml"; YAML.load_stream(File.read(ARGV[0]))' "$file"
          done

      - name: Reject sensitive file types
        run: |
          if find . -type f \( -name '*.kubeconfig' -o -name '.env' -o -name 'kubeconfig*' \) | grep -q .; then
            echo 'Sensitive file type detected.' >&2
            exit 1
          fi

      - name: Reject common credential markers
        run: |
          if git grep -nE '(client-key-data:|token: +eyJ|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . ':!.github/workflows/validate.yml'; then
            echo 'Potential credential detected.' >&2
            exit 1
          fi
