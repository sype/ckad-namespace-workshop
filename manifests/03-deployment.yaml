apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app: frontend
    tier: web
    app.kubernetes.io/part-of: ckad-namespace-workshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tier: web
  template:
    metadata:
      labels:
        app: frontend
        tier: web
        app.kubernetes.io/part-of: ckad-namespace-workshop
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
